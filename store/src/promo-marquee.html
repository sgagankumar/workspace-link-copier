<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Marquee / social preview</title>
<link rel="stylesheet" href="../../docs/assets/site.css"><link rel="stylesheet" href="store.css">
<script>
  // Same layout at two sizes: default 1400x560 (Web Store marquee), #social = 1280x640 (Open Graph / GitHub).
  document.documentElement.dataset.size = location.hash === '#social' ? 'social' : 'marquee';
</script>
<style>
  [data-size="marquee"] .canvas { width:1400px; height:560px; }
  [data-size="social"] .canvas { width:1280px; height:640px; }
  .text { position:absolute; left:80px; top:50%; transform:translateY(-50%); width:560px; }
  [data-size="social"] .text { width:520px; }
  .shot { position:absolute; right:80px; top:50%; transform:translateY(-50%); }
  [data-size="social"] .shot { right:60px; }
</style></head>
<body>
<div class="canvas blue">
  <svg class="motif" style="width:620px;height:620px;left:-200px;bottom:-280px;opacity:.07" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
  <div class="text">
    <div class="lockup" style="font-size:24px">
      <svg width="48" height="48" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#fff"/><g transform="translate(28 28) scale(3)"><path fill="#1a73e8" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></g></svg>
      Workspace Link Copier
    </div>
    <h1 class="headline" style="font-size:54px;margin-top:30px">Share the exact email or cell in one click</h1>
    <p class="sub" style="font-size:21px">For Gmail™ and Google Sheets™. No permissions. Nothing leaves your browser.</p>
  </div>
  <div class="shot">
    <div class="mock-zoom" style="position:static;zoom:1.3;width:440px">
      <div class="mock">
        <div class="mock-bar">
          <div class="mock-pill"></div>
          <span class="demo-share"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg><span class="mock-tooltip">Copy link to this email</span></span>
          <span class="mock-dot"></span><span class="mock-dot"></span><span class="mock-avatar"></span>
        </div>
        <div class="mock-body">
          <div class="mock-line head"></div>
          <div class="mock-line w90"></div><div class="mock-line w75"></div><div class="mock-line w60"></div>
        </div>
        <div class="mock-snackbar">Link to email copied</div>
      </div>
    </div>
  </div>
</div>
</body></html>
