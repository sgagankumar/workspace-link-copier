<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="store.css">
<script>
  // #mark = 512x512 icon; #lockup = icon + wordmark (dark text); #lockup-white = for dark backgrounds.
  document.documentElement.dataset.variant = (location.hash || '#mark').slice(1);
</script>
<style>
  html, body { background: transparent; }
  .mark, .lockup-wrap { display: none; }
  [data-variant="mark"] .mark { display: block; width: 512px; height: 512px; }
  [data-variant^="lockup"] .lockup-wrap { display: flex; align-items: center; width: 1200px; height: 300px; padding: 0 40px; box-sizing: border-box; }
  .lockup-wrap .lockup { gap: 36px; font-family: var(--font); font-size: 84px; color: #1f1f1f; }
  [data-variant="lockup-white"] .lockup-wrap .lockup { color: #ffffff; }
</style></head>
<body>
  <img class="mark" src="../../icons/icon.svg" alt="">
  <div class="lockup-wrap"><div class="lockup"><img src="../../icons/icon.svg" width="168" height="168" alt="">Workspace Link Copier</div></div>
</body></html>
